name: macOS

on:
  push:
    branches: [anticheat-cl]
  workflow_dispatch:

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install meson sdl2 openal-soft libpng jpeg-turbo ffmpeg webp

      - name: Build
        run: |
          meson setup \
            --buildtype=release \
            --fatal-meson-warnings \
            -Dsystem-wide=false \
            -Dsdl2=enabled \
            -Dopenal=enabled \
            -Dlibpng=enabled \
            -Dlibjpeg=enabled \
            -Dlibcurl=enabled \
            -Davcodec=enabled \
            -Dx11=disabled \
            -Dwayland=disabled \
            -Dicmp-errors=disabled \
            -Dwindows-crash-dumps=disabled \
            -Dwrap_mode=nofallback \
            -Dpkg_config_path=/opt/homebrew/opt/openal-soft/lib/pkgconfig \
            -Dclient-gtv=true \
            -Danticheat-server=true \
            -Dmvd-server=true \
            -Dmvd-client=true \
            -Dsave-games=true \
            builddir
          meson compile -C builddir

      - uses: actions/upload-artifact@v4
        with:
          name: q2pro-macos-arm64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/game*.dylib
