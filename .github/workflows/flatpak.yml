name: flatpak

# Solo para releases (tags) o a mano: en cada push ya compila el job Linux de build.yml.
on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: q2pro.flatpak
          manifest-path: flatpak/org.q2pro.q2pro.yml
          # Keyed on the manifest so dependency modules are reused between builds.
          cache-key: flatpak-builder-${{ hashFiles('flatpak/**') }}

      - uses: actions/upload-artifact@v4
        with:
          name: q2pro-flatpak
          path: q2pro.flatpak

  release:
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: q2pro-flatpak

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: q2pro.flatpak
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
