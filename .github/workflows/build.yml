name: build

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [master]

env:
  MESON_ARGS: >-
    --auto-features=enabled
    --fatal-meson-warnings
    -Danticheat-server=true
    -Davcodec=enabled
    -Dclient-gtv=true
    -Ddiscord=enabled
    -Dpacketdup-hack=true
    -Dtests=true
    -Dvariable-fps=true
    -Dwerror=true

  MESON_ARGS_WIN: >-
    -Davcodec=disabled
    -Dsdl2=disabled
    -Dwayland=disabled
    -Dwrap_mode=forcefallback
    -Dx11=disabled

  MESON_ARGS_LINUX: >-
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

  MESON_ARGS_MACOS: >-
    -Dbuildtype=release
    -Dsdl2=enabled
    -Dopenal=enabled
    -Dlibpng=enabled
    -Dlibjpeg=enabled
    -Dlibcurl=enabled
    -Davcodec=enabled
    -Dlibwebp=enabled
    -Ddiscord=enabled
    -Dicmp-errors=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback
    -Dx11=disabled
    -Dwayland=disabled
    -Dsystem-wide=false
    -Dclient-gtv=true
    -Danticheat-server=true
    -Dmvd-server=true
    -Dmvd-client=true
    -Dsave-games=true
    -Dpkg_config_path=/opt/homebrew/opt/openal-soft/lib/pkgconfig

  MESON_ARGS_FREEBSD: >-
    -Dbuildtype=release
    -Dc_std=c23
    -Dicmp-errors=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

jobs:
  mingw:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ["i686", "x86_64"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64 nasm meson ninja-build

      - name: Build
        run: |
          meson setup --cross-file=.ci/${{ matrix.arch }}-w64-mingw32.txt \
          ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -C builddir

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-mingw-${{ matrix.arch }}
          path: |
            builddir/*.exe
            builddir/*.dll

  msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ["x86", "x64"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: ilammy/setup-nasm@v1

      - name: Install dependencies
        run: pip3 install --no-input meson ninja

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -C builddir

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc-${{ matrix.arch }}
          path: |
            builddir/*.exe
            builddir/*.dll

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libsdl2-dev libopenal-dev \
          libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
          libcurl4-gnutls-dev libx11-dev libxi-dev \
          libwayland-dev wayland-protocols libdecor-0-dev \
          libwebp-dev libavcodec-dev libavformat-dev \
          libavutil-dev libswresample-dev libswscale-dev

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir
        env:
          CC: ${{ matrix.cc }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.cc }}
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/game*.so

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew update
          brew install meson sdl2 openal-soft libpng jpeg-turbo ffmpeg webp
      - name: Build ${{ matrix.arch }}
        run: |
          meson setup \
            --cross-file=.ci/macos-${{ matrix.arch }}.txt \
            ${{ env.MESON_ARGS }} \
            ${{ env.MESON_ARGS_MACOS }} \
            builddir-${{ matrix.arch }}
          meson compile -C builddir-${{ matrix.arch }}
      - name: Upload per-arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.arch }}
          path: |
            builddir-${{ matrix.arch }}/q2pro
            builddir-${{ matrix.arch }}/q2proded
            builddir-${{ matrix.arch }}/game*.dylib

  macos-universal:
    needs: [macos]
    runs-on: macos-latest
    steps:
      - name: Download per-arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create universal binaries
        run: |
          lipo -create -output q2pro.bin ./artifacts/build-macos-x86_64/q2pro ./artifacts/build-macos-arm64/q2pro
          lipo -create -output q2proded ./artifacts/build-macos-x86_64/q2proded ./artifacts/build-macos-arm64/q2proded
          lipo -create -output game.dylib ./artifacts/build-macos-x86_64/gamex86_64.dylib ./artifacts/build-macos-arm64/gamearm64.dylib
      - name: Create universal Discord SDK dylib
        run: |
          lipo -create -output discord_game_sdk.dylib \
            Discord/lib/x86_64/discord_game_sdk.dylib \
            Discord/lib/aarch64/discord_game_sdk.dylib
      - name: Fix rpath for Discord SDK
        run: |
          install_name_tool -change '@rpath/discord_game_sdk.dylib' '@loader_path/discord_game_sdk.dylib' q2pro.bin
      - name: Ad-hoc code sign
        run: |
          codesign --sign - --force q2pro.bin q2proded game.dylib discord_game_sdk.dylib
      - name: Create launcher
        run: |
          cp .github/mac/launch.sh q2pro
          chmod +x q2pro q2pro.bin q2proded
      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-universal
          path: |
            q2pro
            q2pro.bin
            q2proded
            game.dylib
            discord_game_sdk.dylib
            
  # Descargar y subir los achivos al release.
  release:
    needs: [mingw, msvc, linux, macos-universal] # Espera a que todos terminen
    if: startsWith(github.ref, 'refs/tags/') # Solo se ejecuta si es un tag (ej: v1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/build-mingw-i686/*.exe
            ./artifacts/build-mingw-i686/*.dll
            ./artifacts/build-mingw-x86_64/*.exe
            ./artifacts/build-mingw-x86_64/*.dll
            ./artifacts/build-msvc-x86/*.exe
            ./artifacts/build-msvc-x86/*.dll
            ./artifacts/build-msvc-x64/*.exe
            ./artifacts/build-msvc-x64/*.dll
            ./artifacts/build-linux-gcc/q2pro*
            ./artifacts/build-linux-gcc/*.so
            ./artifacts/build-macos-universal/q2pro
            ./artifacts/build-macos-universal/q2pro.bin
            ./artifacts/build-macos-universal/q2proded
            ./artifacts/build-macos-universal/game.dylib
            ./artifacts/build-macos-universal/discord_game_sdk.dylib
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE }}
            
