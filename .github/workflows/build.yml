name: build

# En cada push/PR solo se compilan Windows y Linux (rápidos).
# macOS (el runner Intel tarda más de 1h y cuesta 10x) y Flatpak solo corren con tags o a mano.
on:
  push:
    branches: [master, anticheat-cl]
    # 'nightly' is moved by the nightly job itself; it must not start a release.
    tags: ['*', '!nightly']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [master, anticheat-cl]
    paths-ignore: ['docs/**', '**.md']
  # Ejecución manual: en GitHub > Actions > build > "Run workflow"
  # (o: gh workflow run build.yml -R ddaychile/q2pro --ref anticheat-cl -f target=windows)
  workflow_dispatch:
    inputs:
      target:
        description: "Qué plataforma compilar"
        type: choice
        default: all
        options: [all, windows, linux, macos, flatpak]

# Un push nuevo cancela la compilación anterior de la misma rama (nunca la de un tag).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MESON_ARGS: >-
    --auto-features=enabled
    --fatal-meson-warnings
    -Danticheat-server=true
    -Davcodec=enabled
    -Dclient-gtv=true
    -Ddiscord=enabled
    -Dpacketdup-hack=true
    -Dtests=true
    -Dvariable-fps=true
    -Dwerror=true

  MESON_ARGS_WIN: >-
    -Davcodec=disabled
    -Dsdl2=disabled
    -Dwayland=disabled
    -Dwrap_mode=forcefallback
    -Dx11=disabled

  MESON_ARGS_LINUX: >-
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

  MESON_ARGS_MACOS: >-
    -Dbuildtype=release
    -Dsdl2=enabled
    -Dopenal=enabled
    -Dlibpng=enabled
    -Dlibjpeg=enabled
    -Dlibcurl=enabled
    -Davcodec=enabled
    -Dlibwebp=enabled
    -Ddiscord=enabled
    -Dicmp-errors=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback
    -Dx11=disabled
    -Dwayland=disabled
    -Dsystem-wide=false
    -Dclient-gtv=true
    -Danticheat-server=true
    -Dmvd-server=true
    -Dmvd-client=true
    -Dsave-games=true

  MESON_ARGS_FREEBSD: >-
    -Dbuildtype=release
    -Dc_std=c23
    -Dicmp-errors=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

jobs:
  msvc:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      matrix:
        arch: ["x64"]
    steps:
      # Full history: version.py names the build r<commit count>~<sha>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: ilammy/setup-nasm@v1

      - name: Install dependencies
        run: pip3 install --no-input meson ninja

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} -Db_vscrt=mt builddir
          meson compile -C builddir

      - name: Bundle Discord SDK DLL
        shell: bash
        run: |
          arch_dir=${{ matrix.arch == 'x86' && 'x86' || 'x86_64' }}
          cp Discord/lib/$arch_dir/discord_game_sdk.dll builddir/
          ls builddir/*.dll

      # Code signing with SignPath. Runs only when the SIGNPATH_API_TOKEN secret exists;
      # without it the build stays unsigned, exactly as before.
      - name: Upload unsigned build for signing
        if: env.SIGNING_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msvc-${{ matrix.arch }}
          path: builddir/*.exe
          retention-days: 1

      - name: Sign with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: q2dday
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: signed

      - name: Replace binaries with signed ones
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        run: cp signed/*.exe builddir/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc-${{ matrix.arch }}
          retention-days: 14
          path: |
            builddir/*.exe
            builddir/*.dll

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libsdl2-dev libopenal-dev \
          libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
          libcurl4-gnutls-dev libx11-dev libxi-dev \
          libwayland-dev wayland-protocols libdecor-0-dev \
          libwebp-dev libavcodec-dev libavformat-dev \
          libavutil-dev libswresample-dev libswscale-dev

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir
          cp Discord/lib/x86_64/discord_game_sdk.so builddir/
          cp .ci/icons/q2dday-512.png builddir/q2dday.png
        env:
          CC: ${{ matrix.cc }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.cc }}
          retention-days: 14
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/game*.so
            builddir/discord_game_sdk.so
            builddir/q2dday.png

  # Q2Dday.app: a self-contained bundle. Homebrew dylibs are copied into
  # Contents/Frameworks by dylibbundler, the Discord SDK is copied in by hand,
  # and the build fails if any /usr/local, /opt/homebrew or @rpath reference leaks.
  macos:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            discord_dir: aarch64
          - arch: x86_64
            runner: macos-15-intel
            discord_dir: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Intel: Homebrew has no bottles for this runner, so the dependencies
      # compile from source (~1h). Cache the installed kegs between runs.
      # Fixed key: the cache is saved once and reused. Bump v1 to rebuild it
      # (for example after changing the package list below).
      - name: Restore Homebrew cache (x86_64)
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/Cellar
            /usr/local/opt
          key: brew-x86_64-v1
          restore-keys: |
            brew-app-x86_64-

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install meson cmake pkg-config openal-soft ffmpeg jpeg-turbo webp dylibbundler
          # Restored kegs may lack their bin/lib/pkgconfig links; relink them.
          for f in $(brew list --formula); do brew link --overwrite "$f" >/dev/null 2>&1 || true; done

      # Homebrew's sdl2 is sdl2-compat, which loads SDL3 at runtime and cannot be bundled.
      - name: Build SDL2 from source
        run: |
          SDLV=2.32.10
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-$SDLV/SDL2-$SDLV.tar.gz | tar xz
          cmake -S SDL2-$SDLV -B sdl2-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl2" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl2-build -j4
          cmake --install sdl2-build
          # Absolute install name so dylibbundler can resolve it.
          install_name_tool -id "$HOME/sdl2/lib/libSDL2-2.0.0.dylib" "$HOME/sdl2/lib/libSDL2-2.0.0.dylib"

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl2/lib/pkgconfig:$(brew --prefix openal-soft)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # libpng is built statically from its wrap so the bundle does not carry
          # a Homebrew libpng. Later -D options override the ones in MESON_ARGS_MACOS.
          # -Dwerror=false: the linker treats version-mismatch warnings from Homebrew dylibs as fatal.
          meson setup --cross-file=.ci/macos-${{ matrix.arch }}.txt \
            ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MACOS }} \
            -Dwerror=false -Dwrap_mode=default --force-fallback-for=libpng \
            builddir-${{ matrix.arch }}
          meson compile -C builddir-${{ matrix.arch }}

      - name: Assemble Q2Dday.app
        run: |
          B=builddir-${{ matrix.arch }}
          APP=Q2Dday.app
          mkdir -p "$APP/Contents/MacOS/baseq2" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp "$B/q2pro" "$B/q2proded" "$APP/Contents/MacOS/"
          cp "$B"/game*.dylib "$APP/Contents/MacOS/baseq2/"
          cp .ci/mac/Info.plist "$APP/Contents/Info.plist"
          cp .ci/icons/q2dday.icns "$APP/Contents/Resources/"
          install -m 0755 .ci/mac/q2pro-launcher "$APP/Contents/MacOS/q2pro-launcher"
          # Discord SDK: q2pro loads it by @rpath; point it at the bundle's Frameworks.
          cp "Discord/lib/${{ matrix.discord_dir }}/discord_game_sdk.dylib" "$APP/Contents/Frameworks/"
          install_name_tool -change "@rpath/discord_game_sdk.dylib" \
            "@executable_path/../Frameworks/discord_game_sdk.dylib" "$APP/Contents/MacOS/q2pro"
          install_name_tool -id "@executable_path/../Frameworks/discord_game_sdk.dylib" \
            "$APP/Contents/Frameworks/discord_game_sdk.dylib"

      - name: Bundle Homebrew dylibs into the app
        timeout-minutes: 10
        run: |
          APP=Q2Dday.app
          # </dev/null: dylibbundler prompts forever on a missing library.
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/q2pro" \
            -x "$APP/Contents/MacOS/q2proded" \
            -x "$APP/Contents/MacOS/baseq2/game"*.dylib \
            -d "$APP/Contents/Frameworks/" \
            -s "$HOME/sdl2/lib" \
            -p "@executable_path/../Frameworks/" </dev/null
          # dyld refuses binaries with duplicate LC_RPATH entries.
          RP="@executable_path/../Frameworks/"
          for f in "$APP/Contents/MacOS/q2pro" "$APP/Contents/MacOS/q2proded" "$APP/Contents/MacOS/baseq2/"*.dylib; do
            n=$(otool -l "$f" | grep -c "path $RP " || true)
            while [ "$n" -gt 1 ]; do
              install_name_tool -delete_rpath "$RP" "$f"
              n=$((n-1))
            done
          done

      - name: Verify the app has no external references
        run: |
          APP=Q2Dday.app
          BAD=0
          FILES=$(find "$APP/Contents/MacOS" "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -perm -u+x \) ! -name q2pro-launcher)
          for f in $FILES; do
            case "$f" in *.dylib) SKIP=3 ;; *) SKIP=2 ;; esac
            if otool -L "$f" | tail -n +$SKIP | grep -E "/usr/local/|/opt/homebrew|/opt/local|@rpath"; then
              echo "leak in $f"; BAD=1
            fi
          done
          [ $BAD = 0 ] || { echo "ERROR: external dependency leaked into the bundle"; exit 1; }
          echo "OK: bundle is self-contained"

      - name: Stamp LSMinimumSystemVersion from bundled code
        run: |
          APP=Q2Dday.app
          FILES=$(find "$APP/Contents/MacOS" "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -perm -u+x \) ! -name q2pro-launcher)
          MIN=$(for f in $FILES; do otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; b=0} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; m=0}'; done | sort -V | tail -1)
          echo "LSMinimumSystemVersion: $MIN"
          plutil -replace LSMinimumSystemVersion -string "$MIN" "$APP/Contents/Info.plist"

      - name: Ad-hoc sign and archive
        run: |
          codesign --force --deep --sign - Q2Dday.app
          codesign --verify --verbose Q2Dday.app
          # ditto keeps symlinks, exec bits and signatures through upload/download.
          ditto -c -k --sequesterRsrc --keepParent Q2Dday.app Q2Dday-macOS-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Q2Dday-macOS-${{ matrix.arch }}
          path: Q2Dday-macOS-${{ matrix.arch }}.zip
          retention-days: 14

  # One universal app from the two per-architecture bundles.
  macos-universal:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos')) }}
    needs: [macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Q2Dday-macOS-arm64
          path: in-arm
      - uses: actions/download-artifact@v4
        with:
          name: Q2Dday-macOS-x86_64
          path: in-x86

      - name: Merge into a universal app
        run: |
          ditto -x -k in-arm/Q2Dday-macOS-arm64.zip arm
          ditto -x -k in-x86/Q2Dday-macOS-x86_64.zip x86
          cp -R arm/Q2Dday.app Q2Dday.app
          # Files only the x86_64 bundle has (for example its game library).
          (cd x86/Q2Dday.app && find . -type f) | while read -r f; do
            [ -e "Q2Dday.app/$f" ] || { mkdir -p "Q2Dday.app/$(dirname "$f")"; cp "x86/Q2Dday.app/$f" "Q2Dday.app/$f"; }
          done
          # Mach-O files in both bundles: combine them with lipo.
          (cd arm/Q2Dday.app && find . -type f) | while read -r f; do
            if [ -e "x86/Q2Dday.app/$f" ] && file "arm/Q2Dday.app/$f" | grep -q "Mach-O"; then
              lipo -create "arm/Q2Dday.app/$f" "x86/Q2Dday.app/$f" -output "Q2Dday.app/$f"
            fi
          done
          # The app must run wherever either slice runs: use the higher minimum.
          MIN=$(for a in arm x86; do /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" $a/Q2Dday.app/Contents/Info.plist; done | sort -V | tail -1)
          plutil -replace LSMinimumSystemVersion -string "$MIN" Q2Dday.app/Contents/Info.plist

      - name: Verify both architectures
        run: |
          for f in Q2Dday.app/Contents/MacOS/q2pro Q2Dday.app/Contents/MacOS/q2proded; do
            archs=$(lipo -archs "$f"); echo "$f: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal: $f"; exit 1 ;; esac
          done

      - name: Ad-hoc sign and archive
        run: |
          codesign --force --deep --sign - Q2Dday.app
          codesign --verify --verbose Q2Dday.app
          ditto -c -k --sequesterRsrc --keepParent Q2Dday.app Q2Dday-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Q2Dday-macOS-universal
          path: Q2Dday-macOS-universal.zip
          retention-days: 14

  # Linux Flatpak bundle. Like macOS, only on tags or manual runs.
  flatpak:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'flatpak')) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: q2pro.flatpak
          manifest-path: flatpak/org.q2pro.q2pro.yml
          # Keyed on the manifest so dependency modules are reused between builds.
          cache-key: flatpak-builder-${{ hashFiles('flatpak/**') }}

      - uses: actions/upload-artifact@v4
        with:
          name: q2pro-flatpak
          path: q2pro.flatpak
          retention-days: 14

  # Descargar y subir los achivos al release.
  release:
    needs: [msvc, linux, macos-universal, flatpak] # Espera a que todos terminen
    if: startsWith(github.ref, 'refs/tags/') # Solo se ejecuta si es un tag (ej: v1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag named rNNNN must sit on commit number NNNN, so the release name
      # matches the version the binaries report. Other tag names are not checked.
      - name: Check rNNNN tag against the commit count
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            r[0-9]*)
              N=$(git rev-list --count HEAD)
              if [ "$TAG" != "r$N" ]; then
                echo "::error::El tag $TAG está en el commit número $N: debería llamarse r$N"
                exit 1
              fi ;;
          esac

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/build-msvc-x64/*.exe
            ./artifacts/build-msvc-x64/*.dll
            ./artifacts/build-linux-gcc/q2pro*
            ./artifacts/build-linux-gcc/*.so
            ./artifacts/Q2Dday-macOS-universal/Q2Dday-macOS-universal.zip
            ./artifacts/q2pro-flatpak/q2pro.flatpak
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE }}

  # Nightly: every push to anticheat-cl (or a manual 'all' run on it) replaces
  # the files of the "nightly" release with this build's Windows and Linux
  # clients and moves the nightly tag to this commit. No rNNNN tag is created.
  nightly:
    needs: [msvc, linux]
    if: ${{ github.ref == 'refs/heads/anticheat-cl' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows and Linux builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: ./artifacts

      - name: Package
        run: |
          VER=$(python3 version.py)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir out
          (cd artifacts/build-msvc-x64 && zip -9 -r ../../out/q2dday-windows-x64.zip .)
          # Artifacts lose the exec bit; restore it before packing.
          chmod +x artifacts/build-linux-gcc/q2pro artifacts/build-linux-gcc/q2proded
          tar czf out/q2dday-linux-x86_64.tar.gz -C artifacts/build-linux-gcc .
          echo "$VER" > out/version.txt
          ls -l out

      - name: Replace the nightly release files
        run: |
          # Drop the previous files so none from an older layout linger.
          for a in $(gh release view nightly --json assets -q '.assets[].name'); do
            gh release delete-asset nightly "$a" -y
          done
          gh release upload nightly out/* --clobber
          gh release edit nightly -t "Nightly" --latest \
            -n "Nightly $VER (anticheat-cl), $(date -u '+%Y-%m-%d %H:%M UTC'). Windows x64 y Linux x86_64."

      - name: Move the nightly tag to this commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/nightly",
              sha: context.sha,
              force: true
            })

